
name: Module 3 - Workflow Architecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show GitHub contexts
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Show expression
        run: echo "Branch/ref is ${{ github.ref }}"

      - name: Conditional step
        if: github.ref == 'refs/heads/main'
        run: echo "This step runs on main"

  dependent-job:
    runs-on: ubuntu-latest
    needs: inspect

    steps:
      - name: Show job dependency
        run: echo "The inspect job completed successfully"
