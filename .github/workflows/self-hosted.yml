
name: Module 5 - Self Hosted Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Show self-hosted machine
        shell: pwsh
        run: |
          Write-Output "Self-hosted runner is working"
          Write-Output "Computer: $env:COMPUTERNAME"
          Write-Output "OS: $env:OS"
